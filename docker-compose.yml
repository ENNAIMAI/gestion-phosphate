version: '3.8'

services:
  # 1. Database Service (MySQL 8)
  db:
    image: mysql:8.0
    container_name: phosphate-db
    restart: always
    command: --skip-name-resolve
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-phosphate_stock}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phosphate-network

  # 2. Cache & Queue Broker (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: phosphate-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - phosphate-network

  # 3. Mailbox Server (Mailpit)
  mailpit:
    image: axllent/mailpit:latest
    container_name: phosphate-mailpit
    restart: always
    ports:
      - "8025:8025" # HTTP GUI
      - "1025:1025" # SMTP
    networks:
      - phosphate-network

  # 4. Database Admin Tool (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phosphate-phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - phosphate-network

  # 5. Core Laravel Backend App (PHP-FPM 8.3)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: phosphate-app
    restart: always
    command: >
      sh -c "
      if [ ! -d vendor ]; then composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress; fi &&
      if [ ! -f .env ]; then cp .env.example .env && php artisan key:generate; fi &&
      php artisan migrate --force;
      php-fpm
      "
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phosphate-network

  # 6. Nginx Web Server for Laravel
  nginx:
    image: nginx:alpine
    container_name: phosphate-nginx
    restart: always
    ports:
      - "8085:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - phosphate-network

  # 7. Laravel Queue Worker (Supervisord)
  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: phosphate-queue-worker
    restart: always
    command: /usr/bin/supervisord -n -c /etc/supervisor/conf.d/supervisord.conf
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phosphate-network

  # 8. Laravel Scheduler (Cron replacement loop)
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: phosphate-scheduler
    restart: always
    command: sh -c "while true; do php /var/www/artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phosphate-network

  # 9. FastAPI AI Prediction Service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: phosphate-ai-service
    restart: always
    volumes:
      - ./ai-service:/app
    ports:
      - "8001:8000"
    networks:
      - phosphate-network

  # 10. React Frontend (Vite)
  frontend:
    image: node:20-alpine
    container_name: phosphate-frontend
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3001:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=production
    command: sh -c "npm install --include=dev --no-audit --no-fund && npm run build && npm run preview -- --host 0.0.0.0 --port 5173 --strictPort"
    depends_on:
      - app
    networks:
      - phosphate-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_vendor:
    driver: local

networks:
  phosphate-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
